[project]
name = 'PyONDE'
dynamic = ['version','authors','description','urls']
requires-python = ">= 3.8"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
	    "Development Status :: 3 - Alpha"
	    ]

# matplotlib is deliberately absent from this file.  The interactive viewer
# needs it, but PyONDE's own job is file access, and neither the library nor
# "ondeview --list" / "ondeview --info" needs a plotting library to do it.
# It is not a requirement and not an extra; "ondeview" tells the user to
# install it -- on stderr and in a message box -- if they open the viewer
# without it.  See PyONDE/viewer/dependency.py.

[project.scripts]
ondeview = "PyONDE.bin.ondeview:main"

#[project.scripts]
#example_script = "PyONDE.bin.example_script:main"

[build-system]
requires = ["setuptools>=64","numpy","h5py","setuptools_scm[toml]>=5"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Note: With recent setuptools we can use "version_file" instead of "write_to"
write_to = "PyONDE/_version.py"